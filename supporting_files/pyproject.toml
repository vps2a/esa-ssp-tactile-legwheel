[project]
name = "supporting-files"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "nbformat>=4.2.0",
    "numpy>=2.5.3",
    "plotly>=7.1.0",
    "pyside6>=6.11.2",
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
]

[project.scripts]
legwheel-dataset-browser = "legwheel_dataset_browser.app:main"
legwheel-batch-dataset-builder = "legwheel_batch_builder.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["legwheel_dataset_browser*", "legwheel_batch_builder*"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
