schema_version: "2.0"
# Maximum RGB/depth timestamp separation in milliseconds.
rgb_depth_max_delta_ms: 10.0
# Duration of telemetry used for each FFT in milliseconds.
spectral_window_ms: 1000.0
# Common sampling frequency for the 15 motor and IMU channels in hertz.
telemetry_resample_hz: 100.0
# Largest source-data gap that interpolation may bridge.
maximum_interpolation_gap_ms: 50.0
# Diagnostic two-sigma uncertainty threshold; exceeding it does not reject data.
# Actual uncertainty is saved with each packet for later filtering/inspection.
maximum_pitch_uncertainty_deg: 1.0
# Positive angular distance from the camera to the patch centre.
alpha_off_rad: 0.35
# Full angular width, minimum packet spacing and local telemetry boundaries.
alpha_sp_rad: 0.10
# Effective grouser height added to wheel radius in metres.
# TODO: Estimate this radius correction experimentally.
grouser_effective_height_m: 0.0
# Minimum requested-torque fraction defining the steady run.
minimum_target_torque_fraction: 0.90
# Allowed fractional margin above each measured telemetry rate.
source_rate_tolerance_fraction: 0.05
# Number of samples around each full circular track boundary.
track_point_count: 360
# Metres represented by one integer depth-image unit.
depth_scale_m: 0.001
# Minimum depth points and RANSAC inliers required for a plane.
minimum_plane_points: 40
# Number of random plane candidates tested by RANSAC.
plane_ransac_iterations: 200
# Maximum point-to-plane distance for a RANSAC inlier in metres.
plane_inlier_threshold_m: 0.005
# Minimum valid FFT-channel fraction required for spectral analysis.
minimum_spectral_valid_fraction: 0.8
