camera_name: legwheel_rgbd
depth_registration: true
align_mode: SW
align_target_stream: COLOR
enable_color: true
enable_depth: true
color_qos: SENSOR_DATA
color_camera_info_qos: SENSOR_DATA
depth_qos: SENSOR_DATA
depth_camera_info_qos: SENSOR_DATA
enable_left_ir: false
enable_right_ir: false
enable_accel: true
enable_gyro: true
enable_sync_output_accel_gyro: true
accel_rate: 100hz
gyro_rate: 100hz
enable_point_cloud: false
enable_colored_point_cloud: false
publish_tf: true
tf_publish_rate: 0.0
enable_frame_sync: true
# The Gemini 330-series driver uses the global time domain by default. Orbbec
# explicitly recommends disabling its separate periodic host-time synchronizer
# in that mode. Combining both mechanisms can correct the camera clock while a
# run is active, producing repeated or regressing header stamps (especially
# through a virtualized USB connection). Preserve one monotonic global timeline.
enable_sync_host_time: false
enable_depth_scale: true
enable_noise_removal_filter: true
enable_disparity_to_depth: true
color_width: 640
color_height: 480
color_fps: 30
depth_width: 640
depth_height: 480
depth_fps: 30
