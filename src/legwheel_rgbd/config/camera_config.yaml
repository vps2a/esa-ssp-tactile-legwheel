gemini_336_camera_node:
  ros__parameters:
    # RGB and aligned depth are forwarded only as timestamp-matched pairs.
    # Ten milliseconds accepts the sub-millisecond matches observed from the
    # frame-synchronised driver while rejecting adjacent frames (~33 ms apart).
    rgbd_sync_queue_size: 30
    rgbd_sync_slop_s: 0.01

    source_rgb_topic: /legwheel_rgbd/color/image_raw
    source_rgb_camera_info_topic: /legwheel_rgbd/color/camera_info
    source_depth_topic: /legwheel_rgbd/depth/image_raw
    source_depth_camera_info_topic: /legwheel_rgbd/depth/camera_info
    source_imu_topic: /legwheel_rgbd/gyro_accel/sample

    rgb_topic: /camera/rgbd/rgb/image_raw
    rgb_camera_info_topic: /camera/rgbd/rgb/camera_info
    depth_topic: /camera/rgbd/depth/image_raw
    depth_camera_info_topic: /camera/rgbd/depth/camera_info
    imu_topic: /camera/imu
